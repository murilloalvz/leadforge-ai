name: Live Calibration

on:
  workflow_dispatch:

jobs:
  calibrate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run live calibration
        run: python scripts/calibrate_web.py
